<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Will You Go On a Date With Me?</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="password-screen" class="password-screen">
      <div class="password-card">
        <p class="password-label">Enter the password</p>
        <input id="password-input" class="password-input" type="password" placeholder="Password" />
        <button id="password-submit" class="password-submit" type="button">Unlock</button>
        <p id="password-error" class="password-error hidden">Wrong password</p>
      </div>
    </div>

    <div class="floating-assets" aria-hidden="true">
      <div class="floating-asset asset-1"></div>
      <div class="floating-asset asset-2"></div>
      <div class="floating-asset asset-3"></div>
      <div class="floating-asset asset-4"></div>
      <div class="floating-asset asset-5"></div>
      <div class="floating-asset asset-6"></div>
    </div>

    <main class="app-shell hidden">
      <div class="card">
        <div class="badge">A little question for you</div>
        <div id="question-area" class="question-area">
          <p id="progress-text" class="progress-text">Question 1 of 4</p>
          <h1 id="question-text">Can I take you out on a date?</h1>
          <div id="options" class="options" aria-live="polite"></div>
        </div>

        <div id="result-panel" class="result-panel hidden">
          <h2>It's a date!</h2>
          <div id="summary" class="summary"></div>
          <div class="result-actions">
            <button id="submit-btn" class="primary-btn" type="button">Submit</button>
            <button id="restart-btn" class="secondary-btn white-btn" type="button">Start Again</button>
          </div>
        </div>
      </div>
    </main>

    <script src=".env.js"></script>
    <script src="script.js"></script>
  </body>
</html>
